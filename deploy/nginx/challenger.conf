# Nginx do servidor de aplicação (10.42.90.243)
# Copiar para /etc/nginx/sites-available/challenger (veja docs/INSTALACAO.md, Parte B)
server {
    listen 80 default_server;
    server_name 10.42.90.243 _;

    root /var/www/challenger;
    index index.html;

    # Upload de comprovantes (o padrão do Nginx, 1 MB, recusaria os arquivos)
    client_max_body_size 12m;

    # API Node (PM2, porta 3000 — acessível apenas localmente)
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA: rotas do React (/app, /reset-password, /completar-registo) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
